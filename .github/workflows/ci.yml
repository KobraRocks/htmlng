name: CI

on:
  push:
    branches: [master, production]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke test (validate + build the example project)
        run: |
          node dist/index.js --help > /dev/null
          cd examples/landing
          node ../../dist/index.js validate
          node ../../dist/index.js build
          test -f build/index.html
          test -f build/css/index.css
